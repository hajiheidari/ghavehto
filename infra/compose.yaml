services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ghahvehto
      POSTGRES_USER: ghahvehto
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for the local database}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ghahvehto -d ghahvehto']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
