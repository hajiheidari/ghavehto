name: Foundation validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-api-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ghahvehto_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ghahvehto_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/ghahvehto_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node --test packages/contracts/client.test.ts
      - run: pnpm contracts:export
      - run: node scripts/generate-clients.mjs --check
      - run: git diff --exit-code -- packages/contracts/openapi.json
      - run: pnpm --filter @ghahvehto/api test:db
      - run: node scripts/smoke-web.mjs
  mobile-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghahvehto/contracts build
      - run: pnpm --filter @ghahvehto/api build
      - run: node apps/api/dist/nest/main.js > /tmp/ghahvehto-api.log 2>&1 &
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test --dart-define=RUN_API_INTEGRATION=true --dart-define=API_BASE_URL=http://127.0.0.1:4101
        working-directory: apps/mobile
  native-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Generate pinned Flutter platform scaffolds
        run: flutter create --platforms=android,ios --project-name=ghahvehto --org=com.ghahvehto .
        working-directory: apps/mobile
      - name: Android debug build only
        if: matrix.platform == 'android'
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:4101
        working-directory: apps/mobile
      - name: iOS simulator build only
        if: matrix.platform == 'ios'
        run: flutter build ios --simulator --debug --no-codesign --dart-define=API_BASE_URL=http://127.0.0.1:4101
        working-directory: apps/mobile
