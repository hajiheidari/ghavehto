packages:
  - apps/api
  - apps/web
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': false
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeStrict: true
networkConcurrency: 2
fetchRetries: 4
fetchRetryMintimeout: 2000
fetchRetryMaxtimeout: 15000
fetchTimeout: 120000
# Targeted compatible patches for production advisories; keep major versions pinned.
overrides:
  'path-to-regexp@>=8.0.0 <8.4.0': 8.4.2
  'multer@>=2.0.0 <2.5.0': 2.5.0
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'js-yaml@>=5.0.0 <5.4.1': 5.4.1
